<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="computerGuesser.css">
</head>
<body>
     <h1>Computer gætter dit tal</h1>
     <h2>Insæt dit hemmelige tal forneden</h2>
     <input type="text" name="" id="mitTal">
     <button id="lock">Lås dit svar</button>
     <button id="start" type="button">Start computerens gæt</button>
     <h2>Computeren har gættet <span id="computerGuess"></span></h2>
     <div>
     <button id="op" class="knap" type="button">Du skal gætte højere!</button>
     <button id="ned" class="knap" type="button">Du skal gætte lavere!</button>
     <button id="korrekt" class="knap" type="button">Du har gættet rigtigt!</button>
     </div>
     <h2 class="hide">Computeren gættede dit tal!</h2>

    <script src="computerGuesser.js" defer></script>
</body>
</html>
