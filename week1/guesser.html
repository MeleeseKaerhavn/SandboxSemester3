<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random number guesser</title>
    <link rel="stylesheet" href="guesser.css">
    

</head>
<body>
    <h1>Gæt et tal</h1>

    <div class="hide">
        <video src="images/854394-hd_1280_720_30fps.mp4" style="width: 300px;" autoplay loop></video>
    <button id="replay" style="display: block;">Prøv igen?</button>
    </div>
    
    <script src="guesser.js"></script>
